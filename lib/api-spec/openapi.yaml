openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mans ERP API - Cloud ERP for nonprofit organizations in Saudi Arabia
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: dashboard
    description: Dashboard summary and analytics
  - name: organizations
    description: Organization management
  - name: users
    description: User management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      description: Returns key metrics and statistics for the dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      description: Returns recent activity events in the organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          description: Unauthorized

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      description: Returns all organizations accessible to the user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create organization
      description: Creates a new organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in the organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /chart-of-accounts/tree:
    get:
      operationId: getChartOfAccountsTree
      tags: [chart-of-accounts]
      summary: Get chart of accounts as a hierarchical tree
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nested tree of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartOfAccountNode"
        "401":
          description: Unauthorized

  /chart-of-accounts:
    get:
      operationId: listChartOfAccounts
      tags: [chart-of-accounts]
      summary: List chart of accounts (flat, paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: isGroup
          in: query
          required: false
          schema:
            type: boolean
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedChartOfAccounts"
        "401":
          description: Unauthorized
    post:
      operationId: createChartOfAccount
      tags: [chart-of-accounts]
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChartOfAccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Validation error
        "409":
          description: Account code already exists

  /chart-of-accounts/{id}:
    get:
      operationId: getChartOfAccount
      tags: [chart-of-accounts]
      summary: Get account by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account with children and transaction count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccountDetail"
        "404":
          description: Not found
    patch:
      operationId: updateChartOfAccount
      tags: [chart-of-accounts]
      summary: Update account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChartOfAccountInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Validation error
        "404":
          description: Not found
    delete:
      operationId: deleteChartOfAccount
      tags: [chart-of-accounts]
      summary: Soft-delete an account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "400":
          description: Cannot delete (has transactions or sub-accounts)
        "404":
          description: Not found

  /chart-of-accounts/{id}/toggle-active:
    post:
      operationId: toggleChartOfAccountActive
      tags: [chart-of-accounts]
      summary: Toggle account active/inactive status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Cannot deactivate (has active sub-accounts)
        "404":
          description: Not found

  /fiscal-years:
    get:
      operationId: listFiscalYears
      tags: [fiscal-years]
      summary: List fiscal years
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED, LOCKED] }
      responses:
        "200":
          description: List of fiscal years
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FiscalYear"
    post:
      operationId: createFiscalYear
      tags: [fiscal-years]
      summary: Create fiscal year
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFiscalYearInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalYear"

  /cost-centers:
    get:
      operationId: listCostCenters
      tags: [cost-centers]
      summary: List cost centers
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: isActive
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of cost centers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CostCenter"

  /journal-entries:
    get:
      operationId: listJournalEntries
      tags: [journal-entries]
      summary: List journal entries (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: fiscalYearId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated journal entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedJournalEntries"
    post:
      operationId: createJournalEntry
      tags: [journal-entries]
      summary: Create a journal entry (draft)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Validation error (unbalanced, inactive account, closed year, etc.)

  /journal-entries/{id}:
    get:
      operationId: getJournalEntry
      tags: [journal-entries]
      summary: Get journal entry detail with lines and approval history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Journal entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryDetail"
        "404":
          description: Not found
    patch:
      operationId: updateJournalEntry
      tags: [journal-entries]
      summary: Update a journal entry (DRAFT or UNDER_REVIEW only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJournalEntryInput"
      responses:
        "200":
          description: Updated journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
    delete:
      operationId: deleteJournalEntry
      tags: [journal-entries]
      summary: Soft-delete a DRAFT journal entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]

  /journal-entries/{id}/submit:
    post:
      operationId: submitJournalEntry
      tags: [journal-entries]
      summary: Submit for review (DRAFT → UNDER_REVIEW)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [journal-entries]
      summary: Approve (UNDER_REVIEW → APPROVED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/reject:
    post:
      operationId: rejectJournalEntry
      tags: [journal-entries]
      summary: Reject back to DRAFT
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [journal-entries]
      summary: Post (APPROVED → POSTED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/lock:
    post:
      operationId: lockJournalEntry
      tags: [journal-entries]
      summary: Lock (POSTED → LOCKED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags: [journal-entries]
      summary: Reverse (creates reversal draft, marks original REVERSED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reverseDate: { type: string, format: date }
                reason: { type: string }
      responses:
        "200":
          description: Reversal entry (draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/copy:
    post:
      operationId: copyJournalEntry
      tags: [journal-entries]
      summary: Copy as new DRAFT
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entryDate: { type: string, format: date }
      responses:
        "201":
          description: Copied entry (draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/void:
    post:
      operationId: voidJournalEntry
      tags: [journal-entries]
      summary: Void a POSTED entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        "200":
          description: Voided entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entry-templates:
    get:
      operationId: listJournalEntryTemplates
      tags: [journal-entry-templates]
      summary: List journal entry templates
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntryTemplate"
    post:
      operationId: createJournalEntryTemplate
      tags: [journal-entry-templates]
      summary: Create a journal entry template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryTemplate"

  /journal-entry-templates/{id}:
    get:
      operationId: getJournalEntryTemplate
      tags: [journal-entry-templates]
      summary: Get template detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryTemplate"
    patch:
      operationId: updateJournalEntryTemplate
      tags: [journal-entry-templates]
      summary: Update template
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryTemplate"
    delete:
      operationId: deleteJournalEntryTemplate
      tags: [journal-entry-templates]
      summary: Delete template
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /journal-entry-templates/{id}/use:
    post:
      operationId: useJournalEntryTemplate
      tags: [journal-entry-templates]
      summary: Create a journal entry from a template
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fiscalYearId: { type: string, format: uuid }
                entryDate: { type: string, format: date }
                exchangeRate: { type: number }
              required: [fiscalYearId]
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalOrganizations:
          type: integer
        activeProjects:
          type: integer
        totalBeneficiaries:
          type: integer
        totalDonations:
          type: number
        monthlyGrowth:
          type: number
      required:
        - totalUsers
        - totalOrganizations
        - activeProjects
        - totalBeneficiaries
        - totalDonations
        - monthlyGrowth

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        descriptionAr:
          type: string
        userName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - description
        - descriptionAr
        - userName
        - createdAt

    Organization:
      type: object
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
        registrationNumber:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameEn
        - nameAr
        - type
        - status
        - createdAt

    OrganizationInput:
      type: object
      properties:
        nameEn:
          type: string
          minLength: 1
        nameAr:
          type: string
          minLength: 1
        type:
          type: string
        registrationNumber:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        city:
          type: string
      required:
        - nameEn
        - nameAr
        - type

    OrganizationUpdate:
      type: object
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
        registrationNumber:
          type: string
        email:
          type: string
        phone:
          type: string
        city:
          type: string
        status:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        firstNameEn:
          type: ["string", "null"]
        lastNameEn:
          type: ["string", "null"]
        firstNameAr:
          type: ["string", "null"]
