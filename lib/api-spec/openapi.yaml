openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mans ERP API - Cloud ERP for nonprofit organizations in Saudi Arabia
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: dashboard
    description: Dashboard summary and analytics
  - name: organizations
    description: Organization management
  - name: users
    description: User management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      description: Returns key metrics and statistics for the dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      description: Returns recent activity events in the organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          description: Unauthorized

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      description: Returns all organizations accessible to the user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create organization
      description: Creates a new organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in the organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalOrganizations:
          type: integer
        activeProjects:
          type: integer
        totalBeneficiaries:
          type: integer
        totalDonations:
          type: number
        monthlyGrowth:
          type: number
      required:
        - totalUsers
        - totalOrganizations
        - activeProjects
        - totalBeneficiaries
        - totalDonations
        - monthlyGrowth

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        descriptionAr:
          type: string
        userName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - description
        - descriptionAr
        - userName
        - createdAt

    Organization:
      type: object
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
        registrationNumber:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameEn
        - nameAr
        - type
        - status
        - createdAt

    OrganizationInput:
      type: object
      properties:
        nameEn:
          type: string
          minLength: 1
        nameAr:
          type: string
          minLength: 1
        type:
          type: string
        registrationNumber:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        city:
          type: string
      required:
        - nameEn
        - nameAr
        - type

    OrganizationUpdate:
      type: object
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
        registrationNumber:
          type: string
        email:
          type: string
        phone:
          type: string
        city:
          type: string
        status:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        firstNameEn:
          type: ["string", "null"]
        lastNameEn:
          type: ["string", "null"]
        firstNameAr:
          type: ["string", "null"]
        lastNameAr:
          type: ["string", "null"]
        role:
          type: string
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkId
        - email
        - role
        - createdAt

    UserProfileUpdate:
      type: object
      properties:
        firstNameEn:
          type: string
        lastNameEn:
          type: string
        firstNameAr:
          type: string
        lastNameAr:
          type: string
        avatarUrl:
          type: string
