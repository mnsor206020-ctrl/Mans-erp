        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sourceType:
          type: ["string", "null"]
          description: Source module type (e.g. Donor, Project, Fund, Payroll)
        sourceId:
          type: ["string", "null"]
          format: uuid
