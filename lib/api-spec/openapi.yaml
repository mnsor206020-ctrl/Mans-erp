          description: Receipt number already exists for this organization

  /receipts/{id}:
    get:
      operationId: getReceipt
      tags: [receipts]
      summary: Get receipt by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Receipt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    patch:
      operationId: updateReceipt
      tags: [receipts]
      summary: Update a receipt
      description: Updates mutable fields. Only allowed while status is DRAFT.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptUpdate"
      responses:
        "200":
          description: Updated receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: Validation error or receipt is not in DRAFT status
        "401":
          description: Unauthorized
        "404":
          description: Not found

    delete:
      operationId: deleteReceipt
      tags: [receipts]
      summary: Soft-delete a receipt
      description: Soft-deletes the receipt. Only allowed while status is DRAFT.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Cannot delete — receipt is not in DRAFT status
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /receipts/{id}/confirm:
    post:
      operationId: confirmReceipt
      tags: [receipts]
      summary: Confirm a receipt
      description: >
        Transitions status from DRAFT to CONFIRMED. Atomically increments
        currentBalance on the linked bank account or cash box by amountBase.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Confirmed receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: Receipt is not in DRAFT status, or no bank account/cash box linked
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /receipts/{id}/void:
    post:
      operationId: voidReceipt
      tags: [receipts]
      summary: Void a receipt
      description: >
        Transitions status from CONFIRMED to VOIDED. Atomically decrements
        currentBalance on the linked bank account or cash box by amountBase (reversal).
