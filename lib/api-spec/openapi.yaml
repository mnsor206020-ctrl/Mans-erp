      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidRequest"
      responses:
        "200":
          description: Voided receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: Receipt is not in CONFIRMED status, or void reason missing
        "401":
          description: Unauthorized
        "404":
          description: Not found

