openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mans ERP API - Cloud ERP for nonprofit organizations in Saudi Arabia
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: dashboard
    description: Dashboard summary and analytics
  - name: organizations
    description: Organization management
  - name: users
    description: User management
  - name: attachments
    description: Journal entry file attachments
  - name: notifications
    description: In-app user notifications
  - name: banks
    description: Bank reference data (read-only)
  - name: bank-accounts
    description: Organization bank account management
  - name: cash-boxes
    description: Organization cash box (petty cash) management
  - name: currencies
    description: Currency reference data (read-only)
  - name: receipts
    description: Money received by the organization (bank account or cash box)
  - name: payments
    description: Money paid out by the organization (bank account or cash box)
  - name: petty-cash
    description: Petty cash IN/OUT entries against a cash box
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      description: Returns key metrics and statistics for the dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      description: Returns recent activity events in the organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          description: Unauthorized

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      description: Returns all organizations accessible to the user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create organization
      description: Creates a new organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in the organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /chart-of-accounts/tree:
    get:
      operationId: getChartOfAccountsTree
      tags: [chart-of-accounts]
      summary: Get chart of accounts as a hierarchical tree
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nested tree of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartOfAccountNode"
        "401":
          description: Unauthorized

  /chart-of-accounts:
    get:
      operationId: listChartOfAccounts
      tags: [chart-of-accounts]
      summary: List chart of accounts (flat, paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: isGroup
          in: query
          required: false
          schema:
            type: boolean
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedChartOfAccounts"
        "401":
          description: Unauthorized
    post:
      operationId: createChartOfAccount
      tags: [chart-of-accounts]
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChartOfAccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Validation error
        "409":
          description: Account code already exists

  /chart-of-accounts/{id}:
    get:
      operationId: getChartOfAccount
      tags: [chart-of-accounts]
      summary: Get account by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account with children and transaction count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccountDetail"
        "404":
          description: Not found
    patch:
      operationId: updateChartOfAccount
      tags: [chart-of-accounts]
      summary: Update account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChartOfAccountInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Validation error
        "404":
          description: Not found
    delete:
      operationId: deleteChartOfAccount
      tags: [chart-of-accounts]
      summary: Soft-delete an account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "400":
          description: Cannot delete (has transactions or sub-accounts)
        "404":
          description: Not found

  /chart-of-accounts/{id}/toggle-active:
    post:
      operationId: toggleChartOfAccountActive
      tags: [chart-of-accounts]
      summary: Toggle account active/inactive status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Cannot deactivate (has active sub-accounts)
        "404":
          description: Not found

  /fiscal-years:
    get:
      operationId: listFiscalYears
      tags: [fiscal-years]
      summary: List fiscal years
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED, LOCKED] }
      responses:
        "200":
          description: List of fiscal years
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FiscalYear"
    post:
      operationId: createFiscalYear
      tags: [fiscal-years]
      summary: Create fiscal year
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFiscalYearInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalYear"

  /cost-centers:
    get:
      operationId: listCostCenters
      tags: [cost-centers]
      summary: List cost centers
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: isActive
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of cost centers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CostCenter"

  /journal-entries:
    get:
      operationId: listJournalEntries
      tags: [journal-entries]
      summary: List journal entries (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: fiscalYearId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated journal entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedJournalEntries"
    post:
      operationId: createJournalEntry
      tags: [journal-entries]
      summary: Create a journal entry (draft)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Validation error (unbalanced, inactive account, closed year, etc.)

  /journal-entries/{id}:
    get:
      operationId: getJournalEntry
      tags: [journal-entries]
      summary: Get journal entry detail with lines and approval history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Journal entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryDetail"
        "404":
          description: Not found
    patch:
      operationId: updateJournalEntry
      tags: [journal-entries]
      summary: Update a journal entry (DRAFT or UNDER_REVIEW only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJournalEntryInput"
      responses:
        "200":
          description: Updated journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
    delete:
      operationId: deleteJournalEntry
      tags: [journal-entries]
      summary: Soft-delete a DRAFT journal entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]

  /journal-entries/{id}/submit:
    post:
      operationId: submitJournalEntry
      tags: [journal-entries]
      summary: Submit for review (DRAFT → UNDER_REVIEW)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [journal-entries]
      summary: Approve (UNDER_REVIEW → APPROVED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/reject:
    post:
      operationId: rejectJournalEntry
      tags: [journal-entries]
      summary: Reject back to DRAFT (UNDER_REVIEW or APPROVED → DRAFT)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  minLength: 10
                  description: Mandatory rejection reason (min 10 characters)
              required: [comment]
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Validation error (missing or short comment, invalid status)

  /journal-entries/{id}/approvals:
    get:
      operationId: listJournalEntryApprovals
      tags: [journal-entries]
      summary: List approval history for a journal entry (chronological)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ordered list of approval records with actor details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntryApprovalRecord"
        "404":
          description: Journal entry not found

  /journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [journal-entries]
      summary: Post (APPROVED → POSTED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/lock:
    post:
      operationId: lockJournalEntry
      tags: [journal-entries]
      summary: Lock (POSTED → LOCKED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags: [journal-entries]
      summary: Reverse (creates reversal draft, marks original REVERSED)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reverseDate: { type: string, format: date }
                reason: { type: string }
      responses:
        "200":
          description: Reversal entry (draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/copy:
    post:
      operationId: copyJournalEntry
      tags: [journal-entries]
      summary: Copy as new DRAFT
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entryDate: { type: string, format: date }
      responses:
        "201":
          description: Copied entry (draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/void:
    post:
      operationId: voidJournalEntry
      tags: [journal-entries]
      summary: Void a POSTED entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        "200":
          description: Voided entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}/attachments:
    get:
      operationId: listJournalEntryAttachments
      tags: [attachments]
      summary: List attachments for a journal entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of non-deleted attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntryAttachment"
                required: [data]
        "401":
          description: Unauthorized
        "404":
          description: Journal entry not found
    post:
      operationId: uploadJournalEntryAttachments
      tags: [attachments]
      summary: Upload one or more files to a journal entry (max 10 total, 20 MB each)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required: [files]
      responses:
        "201":
          description: Uploaded attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntryAttachment"
                required: [data]
        "400":
          description: Validation error (MIME type not allowed, file too large, attachment cap exceeded)
        "401":
          description: Unauthorized
        "404":
          description: Journal entry not found

  /journal-entries/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteJournalEntryAttachment
      tags: [attachments]
      summary: Soft-delete an attachment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]
        "401":
          description: Unauthorized
        "404":
          description: Journal entry or attachment not found
    patch:
      operationId: updateJournalEntryAttachment
      tags: [attachments]
      summary: Set or clear isPrimary flag (at most one primary per entry)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isPrimary: { type: boolean }
              required: [isPrimary]
      responses:
        "200":
          description: Updated attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryAttachment"
        "401":
          description: Unauthorized
        "404":
          description: Journal entry or attachment not found

  /journal-entries/{id}/attachments/{attachmentId}/download:
    get:
      operationId: getJournalEntryAttachmentDownloadUrl
      tags: [attachments]
      summary: Get a signed download URL for an attachment (valid 15 minutes)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentDownloadResponse"
        "401":
          description: Unauthorized
        "404":
          description: Journal entry or attachment not found

  /notifications/unread:
    get:
      operationId: getUnreadNotifications
      tags: [notifications]
      summary: Get all unread notifications for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unread notifications, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                required: [data]
        "401":
          description: Unauthorized

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
