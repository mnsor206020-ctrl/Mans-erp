  # ─── Bank Accounts ────────────────────────────────────────────────────────────

  /bank-accounts:
    get:
      operationId: listBankAccounts
      tags: [bank-accounts]
      summary: List organization bank accounts
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [CURRENT, SAVINGS, FIXED_DEPOSIT, PETTY_CASH]
          description: Filter by account type
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active status
        - name: currencyCode
          in: query
          required: false
          schema:
            type: string
          description: Filter by currency code (e.g. SAR, USD)
      responses:
        "200":
          description: List of bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankAccount"
        "401":
          description: Unauthorized

    post:
      operationId: createBankAccount
      tags: [bank-accounts]
      summary: Create a bank account
      description: Creates a new bank account. currentBalance is initialized to openingBalance.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountCreate"
      responses:
        "201":
          description: Bank account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "409":
          description: Account number already exists for this organization

  /bank-accounts/{id}:
    get:
      operationId: getBankAccount
      tags: [bank-accounts]
      summary: Get bank account by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bank account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    patch:
      operationId: updateBankAccount
      tags: [bank-accounts]
      summary: Update a bank account
      description: >
        Updates mutable fields. openingBalance and currentBalance cannot be
        changed via this endpoint — opening balance is immutable after creation;
        current balance is maintained by the system via receipt/payment transactions.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountUpdate"
      responses:
        "200":
          description: Updated bank account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: Not found

    delete:
      operationId: deleteBankAccount
      tags: [bank-accounts]
      summary: Soft-delete a bank account
      description: Soft-deletes the bank account. Returns 409 if currentBalance ≠ 0.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Cannot delete — account has a non-zero balance

  /bank-accounts/{id}/toggle-active:
    post:
      operationId: toggleBankAccountActive
      tags: [bank-accounts]
      summary: Toggle bank account active/inactive status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated bank account with flipped isActive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "401":
          description: Unauthorized
        "404":
          description: Not found

