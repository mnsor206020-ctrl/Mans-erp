    CreateJournalEntryInput:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        fiscalYearId:
          type: string
          format: uuid
        entryDate:
          type: string
          format: date
        type:
          type: string
          enum: [MANUAL, AUTOMATIC, OPENING, CLOSING, ADJUSTMENT]
          default: MANUAL
        currencyCode:
          type: string
          default: SAR
        exchangeRate:
          type: number
          default: 1
        descriptionEn:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        reference:
          type: ["string", "null"]
        sourceType:
          type: ["string", "null"]
          description: Source module type (e.g. Donor, Project, Fund, Payroll)
        sourceId:
          type: ["string", "null"]
          format: uuid
          description: ID of the source record; must be paired with sourceType
        sourceReference:
          type: ["string", "null"]
          description: Human-readable reference from the source
        sourceModuleUrl:
          type: ["string", "null"]
          description: Relative path to source record in the UI (must start with /)
        lines:
          type: array
          description: >
            Required. Minimum 2 lines enforced. Every journal entry must be double-entry
            from creation — total debits must equal total credits (within 0.01 tolerance).
            Each line must reference an active, non-group account that allows direct entries.
            Base amounts (debitBase, creditBase) are computed server-side from the exchange rate.
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalEntryLineInput"
      required:
        - fiscalYearId
        - entryDate
        - lines

    UpdateJournalEntryInput:
      type: object
      properties:
        fiscalYearId:
          type: string
          format: uuid
        entryDate:
          type: string
          format: date
        type:
          type: string
          enum: [MANUAL, AUTOMATIC, OPENING, CLOSING, ADJUSTMENT]
        currencyCode:
          type: string
        exchangeRate:
          type: number
        descriptionEn:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        reference:
          type: ["string", "null"]
        sourceType:
          type: ["string", "null"]
          description: Source module type (e.g. Donor, Project, Fund, Payroll)
        sourceId:
          type: ["string", "null"]
          format: uuid
          description: ID of the source record; must be paired with sourceType
        sourceReference:
          type: ["string", "null"]
          description: Human-readable reference from the source
        sourceModuleUrl:
          type: ["string", "null"]
          description: Relative path to source record in the UI (must start with /)
        lines:
          type: array
          description: >
            When provided, atomically replaces all existing lines on the entry
            (deleteMany + createMany in a single database transaction).
            Minimum 2 lines required. Balance and account eligibility are re-validated.
            Omit this field to update header fields only without touching lines.
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalEntryLineInput"

