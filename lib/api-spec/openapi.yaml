openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mans ERP API - Cloud ERP for nonprofit organizations in Saudi Arabia
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: dashboard
    description: Dashboard summary and analytics
  - name: organizations
    description: Organization management
  - name: users
    description: User management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      description: Returns key metrics and statistics for the dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      description: Returns recent activity events in the organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          description: Unauthorized

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      description: Returns all organizations accessible to the user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create organization
      description: Creates a new organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in the organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /chart-of-accounts/tree:
    get:
      operationId: getChartOfAccountsTree
      tags: [chart-of-accounts]
      summary: Get chart of accounts as a hierarchical tree
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Nested tree of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartOfAccountNode"
        "401":
          description: Unauthorized

  /chart-of-accounts:
    get:
      operationId: listChartOfAccounts
      tags: [chart-of-accounts]
      summary: List chart of accounts (flat, paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: isGroup
          in: query
          required: false
          schema:
            type: boolean
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedChartOfAccounts"
        "401":
          description: Unauthorized
    post:
      operationId: createChartOfAccount
      tags: [chart-of-accounts]
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChartOfAccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Validation error
        "409":
          description: Account code already exists

  /chart-of-accounts/{id}:
    get:
      operationId: getChartOfAccount
      tags: [chart-of-accounts]
      summary: Get account by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account with children and transaction count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccountDetail"
        "404":
          description: Not found
    patch:
      operationId: updateChartOfAccount
      tags: [chart-of-accounts]
      summary: Update account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChartOfAccountInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Validation error
        "404":
          description: Not found
    delete:
      operationId: deleteChartOfAccount
      tags: [chart-of-accounts]
      summary: Soft-delete an account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "400":
          description: Cannot delete (has transactions or sub-accounts)
        "404":
          description: Not found

  /chart-of-accounts/{id}/toggle-active:
    post:
      operationId: toggleChartOfAccountActive
      tags: [chart-of-accounts]
      summary: Toggle account active/inactive status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOfAccount"
        "400":
          description: Cannot deactivate (has active sub-accounts)
        "404":
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalOrganizations:
          type: integer
        activeProjects:
          type: integer
        totalBeneficiaries:
          type: integer
        totalDonations:
          type: number
        monthlyGrowth:
          type: number
      required:
        - totalUsers
        - totalOrganizations
        - activeProjects
        - totalBeneficiaries
        - totalDonations
        - monthlyGrowth

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        descriptionAr:
          type: string
        userName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - description
        - descriptionAr
        - userName
        - createdAt

    Organization:
      type: object
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
        registrationNumber:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameEn
        - nameAr
        - type
        - status
        - createdAt

    OrganizationInput:
      type: object
      properties:
        nameEn:
          type: string
          minLength: 1
        nameAr:
          type: string
          minLength: 1
        type:
          type: string
        registrationNumber:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        city:
          type: string
      required:
        - nameEn
        - nameAr
        - type

    OrganizationUpdate:
      type: object
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
        registrationNumber:
          type: string
        email:
          type: string
        phone:
          type: string
        city:
          type: string
        status:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        firstNameEn:
          type: ["string", "null"]
        lastNameEn:
          type: ["string", "null"]
        firstNameAr:
          type: ["string", "null"]
        lastNameAr:
          type: ["string", "null"]
        role:
          type: string
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkId
        - email
        - role
        - createdAt

    UserProfileUpdate:
      type: object
      properties:
        firstNameEn:
          type: string
        lastNameEn:
          type: string
        firstNameAr:
          type: string
        lastNameAr:
          type: string
        avatarUrl:
          type: string

    ChartOfAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        parentId:
          type: ["string", "null"]
          format: uuid
        code:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        nature:
          type: string
          enum: [DEBIT, CREDIT]
        level:
          type: integer
        isGroup:
          type: boolean
        isActive:
          type: boolean
        allowDirectEntry:
          type: boolean
        currencyCode:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - code
        - nameEn
        - nameAr
        - type
        - nature
        - level
        - isGroup
        - isActive
        - allowDirectEntry
        - createdAt
        - updatedAt

    ChartOfAccountDetail:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        parentId:
          type: ["string", "null"]
        code:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
        nature:
          type: string
        level:
          type: integer
        isGroup:
          type: boolean
        isActive:
          type: boolean
        allowDirectEntry:
          type: boolean
        currencyCode:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        transactionCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        parent:
          type: object
          nullable: true
          properties:
            id:
              type: string
            code:
              type: string
            nameEn:
              type: string
            nameAr:
              type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChartOfAccount"
      required:
        - id
        - code
        - nameEn
        - nameAr
        - type
        - nature
        - level
        - isGroup
        - isActive
        - allowDirectEntry
        - transactionCount
        - createdAt
        - updatedAt

    ChartOfAccountNode:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        parentId:
          type: ["string", "null"]
        code:
          type: string
        nameEn:
          type: string
        nameAr:
          type: string
        type:
          type: string
        nature:
          type: string
        level:
          type: integer
        isGroup:
          type: boolean
        isActive:
          type: boolean
        allowDirectEntry:
          type: boolean
        currencyCode:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChartOfAccountNode"
      required:
        - id
        - code
        - nameEn
        - nameAr
        - type
        - nature
        - level
        - isGroup
        - isActive
        - allowDirectEntry

    PaginatedChartOfAccounts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChartOfAccount"
        meta:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
          required:
            - page
            - pageSize
            - total
            - totalPages
      required:
        - data
        - meta

    CreateChartOfAccountInput:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        parentId:
          type: ["string", "null"]
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 200
        nameAr:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        nature:
          type: string
          enum: [DEBIT, CREDIT]
        isGroup:
          type: boolean
        currencyCode:
          type: string
        notes:
          type: string
      required:
        - code
        - nameEn
        - nameAr
        - type

    UpdateChartOfAccountInput:
      type: object
      properties:
        parentId:
          type: ["string", "null"]
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 200
        nameAr:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        nature:
          type: string
          enum: [DEBIT, CREDIT]
        isGroup:
          type: boolean
        currencyCode:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
