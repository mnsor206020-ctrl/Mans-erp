      summary: List petty cash entries
      security:
        - bearerAuth: []
      parameters:
        - name: cashBoxId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by cash box
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [IN, OUT]
          description: Filter by entry type
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter entries on or after this date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter entries on or before this date
      responses:
        "200":
          description: List of petty cash entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PettyCash"
        "401":
          description: Unauthorized

    post:
      operationId: createPettyCash
      tags: [petty-cash]
      summary: Create a petty cash entry
      description: >
        Creates a petty cash entry and immediately updates CashBox.currentBalance.
        IN entries increment the balance; OUT entries decrement it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PettyCashCreate"
      responses:
        "201":
          description: Petty cash entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCash"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: Cash box not found

  /petty-cash/{id}:
    get:
      operationId: getPettyCash
      tags: [petty-cash]
      summary: Get petty cash entry by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Petty cash entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PettyCash"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    delete:
      operationId: deletePettyCash
      tags: [petty-cash]
      summary: Soft-delete a petty cash entry
      description: >
        Soft-deletes the entry and atomically reverses the balance update:
        IN entries decrement CashBox.currentBalance; OUT entries increment it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ─── Reports ─────────────────────────────────────────────────────────────────

  /reports/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [reports]
      summary: Get Trial Balance report
      description: >
        Returns aggregated debit and credit totals per account for all POSTED
        journal entries within the specified fiscal year. Optionally filtered
        to entries on or before the asOf date.
      security:
        - bearerAuth: []
      parameters:
        - name: fiscalYearId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: UUID of the fiscal year
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date }
          description: Only include entries on or before this date (ISO 8601)
      responses:
        "200":
          description: Trial balance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalance"
        "400":
          description: Validation error (missing fiscalYearId)
        "401":
          description: Unauthorized
        "404":
          description: Fiscal year not found

  /reports/account-ledger:
    get:
      operationId: getAccountLedger
      tags: [reports]
      summary: Get Account Ledger report
      description: >
        Returns all POSTED journal entry lines for a specific account within a
        date range, ordered by entry date, journal number, and line number.
        Includes a server-calculated running balance column.
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: UUID of the chart of account
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: Start date (ISO 8601, inclusive)
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: End date (ISO 8601, inclusive)
      responses:
        "200":
          description: Account ledger data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLedger"
        "400":
          description: Validation error (missing required params)
        "401":
          description: Unauthorized
        "404":
          description: Account not found

  /reports/balance-sheet:
    get:
      operationId: getBalanceSheet
      tags: [reports]
      summary: Get Balance Sheet report
      description: >
        Returns aggregated account balances grouped into Assets, Liabilities,
        and Equity sections for all POSTED journal entries in the fiscal year
        up to the given asOf date. Includes totals and an isBalanced flag
        verifying the accounting equation (Assets = Liabilities + Equity).
      security:
        - bearerAuth: []
      parameters:
        - name: fiscalYearId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: UUID of the fiscal year
        - name: asOf
          in: query
          required: true
          schema: { type: string, format: date }
          description: Report date — include entries on or before this date (ISO 8601)
      responses:
        "200":
          description: Balance sheet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSheet"
        "400":
          description: Validation error (missing required params)
        "401":
          description: Unauthorized
        "404":
          description: Fiscal year not found

